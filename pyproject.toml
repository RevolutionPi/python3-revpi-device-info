[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint.select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # Pyflakes
    "Q",   # flake8-quotes
]
lint.ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "D107",   # undocumented-public-init
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
